<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1525"/>
      <stop offset="50%" stop-color="#142040"/>
      <stop offset="100%" stop-color="#182848"/>
    </linearGradient>
    <radialGradient id="spark" cx="62%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#142040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark2" cx="80%" cy="70%" r="25%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#142040" stop-opacity="0"/>
    </radialGradient>
    <pattern id="engGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.4"/>
    </pattern>
    <pattern id="engGridMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.6"/>
    </pattern>
    <pattern id="crosshatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#f59e0b" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1920" height="700" fill="url(#bg)"/>
  <rect width="1920" height="700" fill="url(#engGrid)"/>
  <rect width="1920" height="700" fill="url(#engGridMajor)"/>
  <rect width="1920" height="700" fill="url(#crosshatch)"/>
  <rect width="1920" height="700" fill="url(#spark)"/>
  <rect width="1920" height="700" fill="url(#spark2)"/>

  <!-- CNC Lathe schematic -->
  <g transform="translate(1250, 320)" opacity="0.22">
    <!-- Lathe bed -->
    <rect x="-300" y="120" width="600" height="30" rx="2" fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="-280" y1="130" x2="280" y2="130" stroke="#f59e0b" stroke-width="1.2"/>
    <line x1="-280" y1="140" x2="280" y2="140" stroke="#f59e0b" stroke-width="1.2"/>
    <!-- Headstock -->
    <rect x="-300" y="-80" width="100" height="200" rx="3" fill="#f59e0b" fill-opacity="0.03" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- Spindle -->
    <circle cx="-250" cy="20" r="50" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="-250" cy="20" r="35" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="-250" cy="20" r="15" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="2"/>
    <!-- Chuck jaws -->
    <line x1="-250" y1="-30" x2="-250" y2="-55" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="-220" y1="40" x2="-205" y2="60" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="-280" y1="40" x2="-295" y2="60" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- Workpiece -->
    <rect x="-200" y="5" width="300" height="30" rx="2" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- Tool post -->
    <rect x="-50" y="-40" width="60" height="80" rx="2" fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-20" y1="5" x2="-20" y2="35" stroke="#f59e0b" stroke-width="4"/>
    <polygon points="-27,35 -13,35 -20,48" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Tailstock -->
    <rect x="140" y="-40" width="80" height="120" rx="3" fill="#f59e0b" fill-opacity="0.03" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="140" y1="20" x2="100" y2="20" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="100" cy="20" r="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- CNC Milling head - upper right -->
  <g transform="translate(1650, 150)" opacity="0.15">
    <rect x="-30" y="-80" width="60" height="120" rx="4" fill="#f59e0b" fill-opacity="0.03" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M -15,40 L -10,70 L 10,70 L 15,40" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <rect x="-8" y="70" width="16" height="50" rx="1" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-8" y1="75" x2="8" y2="95" stroke="#f59e0b" stroke-width="1.2"/>
    <line x1="-8" y1="85" x2="8" y2="105" stroke="#f59e0b" stroke-width="1.2"/>
    <line x1="-8" y1="95" x2="8" y2="115" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="-40" y="-120" width="80" height="50" rx="5" fill="#f59e0b" fill-opacity="0.03" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Coordinate axes -->
  <g transform="translate(1000, 550)" opacity="0.12">
    <line x1="0" y1="0" x2="150" y2="0" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="150,0 138,-6 138,6" fill="#f59e0b"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="0,-120 -6,-108 6,-108" fill="#f59e0b"/>
    <line x1="0" y1="0" x2="-80" y2="60" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="-80,60 -66,53 -73,46" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
  </g>

  <!-- Spark particles - cutting zone -->
  <g fill="#f59e0b" opacity="0.2">
    <circle cx="1230" cy="310" r="2"/>
    <circle cx="1245" cy="295" r="1.5"/>
    <circle cx="1260" cy="285" r="2.5"/>
    <circle cx="1240" cy="275" r="1.5"/>
    <circle cx="1255" cy="265" r="2"/>
    <circle cx="1225" cy="290" r="1.2"/>
    <circle cx="1270" cy="300" r="1.8"/>
    <circle cx="1250" cy="250" r="1.2"/>
    <circle cx="1235" cy="260" r="1.5"/>
    <circle cx="1265" cy="270" r="2"/>
    <circle cx="1220" cy="270" r="1"/>
    <circle cx="1275" cy="255" r="1.5"/>
    <circle cx="1248" cy="240" r="1"/>
  </g>

  <!-- Dimension callouts -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="0.8">
    <rect x="1500" y="500" width="120" height="40" rx="2" fill="none"/>
    <line x1="1555" y1="505" x2="1555" y2="535"/>
  </g>

  <!-- Accent lines -->
  <line x1="0" y1="698" x2="1920" y2="698" stroke="#f59e0b" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="0" x2="1920" y2="0" stroke="#f59e0b" stroke-width="1.5" opacity="0.2"/>
</svg>