<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a2744" />
      <stop offset="50%" style="stop-color:#142040" />
      <stop offset="100%" style="stop-color:#0d1728" />
    </linearGradient>
    <linearGradient id="accent-fade" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e2d4a" stroke-width="0.5" />
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)" />
  <rect x="800" y="0" width="400" height="400" fill="url(#accent-fade)" />
  <!-- CNC Machine illustration on left -->
  <g transform="translate(250, 200)" fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <!-- Machine frame -->
    <rect x="-150" y="-130" width="300" height="260" rx="6" stroke-width="2" />
    <!-- Work table -->
    <rect x="-120" y="50" width="240" height="20" rx="3" stroke-width="2" />
    <!-- Spindle column -->
    <rect x="-20" y="-110" width="40" height="140" rx="3" stroke-width="2" />
    <!-- Tool head -->
    <polygon points="0,30 -12,50 12,50" stroke-width="2" fill="#f59e0b" opacity="0.2" />
    <!-- Workpiece -->
    <rect x="-40" y="50" width="80" height="20" rx="2" stroke-width="1.5" fill="#1e2d4a" />
    <!-- Spark lines -->
    <line x1="0" y1="50" x2="-15" y2="38" stroke-width="1" />
    <line x1="0" y1="50" x2="15" y2="38" stroke-width="1" />
    <line x1="0" y1="50" x2="-8" y2="35" stroke-width="1" />
    <line x1="0" y1="50" x2="8" y2="35" stroke-width="1" />
    <!-- Control panel -->
    <rect x="110" y="-80" width="50" height="70" rx="4" stroke-width="1.5" />
    <circle cx="135" cy="-55" r="8" stroke-width="1" />
    <line x1="120" y1="-35" x2="150" y2="-35" stroke-width="1" />
    <line x1="120" y1="-25" x2="150" y2="-25" stroke-width="1" />
    <!-- Axis labels -->
    <text x="-140" y="-50" font-family="Arial" font-size="12" fill="#f59e0b" opacity="0.6">X</text>
    <text x="30" y="-100" font-family="Arial" font-size="12" fill="#f59e0b" opacity="0.6">Z</text>
  </g>
  <!-- Text content on the right -->
  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#f59e0b" />
    <text x="30" y="19" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#142040" text-anchor="middle">AVL</text>
    <!-- Main heading -->
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="2">CNC KATASKEYEZ</text>
    <text x="0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#f59e0b" letter-spacing="1">KATA PARAGGELIA</text>
    <!-- Description -->
    <text x="0" y="175" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8899b5" letter-spacing="1">Brass, steel, aluminum machining</text>
    <text x="0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8899b5" letter-spacing="1">CNC lathe &amp; milling | Precision parts</text>
    <line x1="0" y1="230" x2="120" y2="230" stroke="#f59e0b" stroke-width="2" />
  </g>
  <!-- Top and bottom accent lines -->
  <rect x="0" y="0" width="1200" height="3" fill="#f59e0b" opacity="0.6" />
  <rect x="0" y="397" width="1200" height="3" fill="#f59e0b" opacity="0.3" />
</svg>
