<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700" width="1920" height="700">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="40%" stop-color="#142040"/>
      <stop offset="100%" stop-color="#1c2f55"/>
    </linearGradient>
    <!-- Warm glow from right -->
    <radialGradient id="glow" cx="70%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#142040" stop-opacity="0"/>
    </radialGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>
    <!-- Hex pattern for pneumatic feel -->
    <pattern id="hex" width="50" height="86.6" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <polygon points="25,0 50,14.4 50,43.3 25,57.7 0,43.3 0,14.4" fill="none" stroke="#f59e0b" stroke-opacity="0.03" stroke-width="0.5"/>
      <polygon points="25,28.9 50,43.3 50,72.2 25,86.6 0,72.2 0,43.3" fill="none" stroke="#f59e0b" stroke-opacity="0.02" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1920" height="700" fill="url(#bg)"/>
  <rect width="1920" height="700" fill="url(#grid)"/>
  <rect width="1920" height="700" fill="url(#hex)"/>
  <rect width="1920" height="700" fill="url(#glow)"/>

  <!-- Pneumatic chamber - large decorative element right side -->
  <g transform="translate(1300, 350)" opacity="0.10">
    <!-- Outer cylinder -->
    <ellipse cx="0" cy="0" rx="220" ry="280" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="200" ry="260" fill="none" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Diaphragm folds (bellows) -->
    <ellipse cx="0" cy="-180" rx="180" ry="20" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="0" cy="-130" rx="200" ry="22" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <ellipse cx="0" cy="-80" rx="210" ry="20" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="0" cy="-30" rx="215" ry="18" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="0" cy="20" rx="215" ry="18" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="0" cy="70" rx="210" ry="20" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <ellipse cx="0" cy="120" rx="200" ry="22" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="0" cy="170" rx="180" ry="20" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Center push rod -->
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="-280" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="0" cy="280" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Mounting bracket -->
    <rect x="-30" y="-300" width="60" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="-30" y="280" width="60" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Second smaller chamber - upper right -->
  <g transform="translate(1650, 180)" opacity="0.06">
    <ellipse cx="0" cy="0" rx="100" ry="130" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="0" cy="-80" rx="85" ry="12" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="0" cy="-40" rx="95" ry="14" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="98" ry="14" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="0" cy="40" rx="95" ry="14" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <ellipse cx="0" cy="80" rx="85" ry="12" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Air pressure lines (pneumatic tubing) -->
  <g stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.08">
    <!-- Curved pneumatic lines -->
    <path d="M 950,600 Q 1050,500 1100,350 Q 1150,200 1300,150"/>
    <path d="M 980,650 Q 1080,520 1150,380 Q 1220,240 1350,200"/>
    <!-- Connection dots -->
    <circle cx="950" cy="600" r="4" fill="#f59e0b"/>
    <circle cx="1300" cy="150" r="4" fill="#f59e0b"/>
    <circle cx="980" cy="650" r="4" fill="#f59e0b"/>
    <circle cx="1350" cy="200" r="4" fill="#f59e0b"/>
  </g>

  <!-- Pressure gauge - decorative -->
  <g transform="translate(1700, 520)" opacity="0.07">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Gauge marks -->
    <line x1="0" y1="-55" x2="0" y2="-65" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="55" y1="0" x2="65" y2="0" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="0" y2="65" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="-55" y1="0" x2="-65" y2="0" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="39" y1="-39" x2="46" y2="-46" stroke="#f59e0b" stroke-width="1"/>
    <line x1="39" y1="39" x2="46" y2="46" stroke="#f59e0b" stroke-width="1"/>
    <line x1="-39" y1="-39" x2="-46" y2="-46" stroke="#f59e0b" stroke-width="1"/>
    <line x1="-39" y1="39" x2="-46" y2="46" stroke="#f59e0b" stroke-width="1"/>
    <!-- Needle -->
    <line x1="0" y1="0" x2="35" y2="-35" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#f59e0b"/>
    <!-- BAR label -->
    <text x="0" y="30" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">BAR</text>
  </g>

  <!-- Technical specs floating -->
  <g opacity="0.04" fill="#ffffff" font-family="monospace" font-size="9">
    <text x="1050" y="100">P = 10 BAR MAX</text>
    <text x="1050" y="115">T24/T30 SERIES</text>
    <text x="1500" y="650">SPEC: EN-ISO-6432</text>
  </g>

  <!-- Horizontal accent lines -->
  <line x1="0" y1="698" x2="1920" y2="698" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="0" x2="1920" y2="0" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- Content area -->
  <g transform="translate(120, 180)">
    <!-- Category label -->
    <text x="0" y="0" fill="#f59e0b" font-family="'Roboto Condensed', 'Arial Narrow', sans-serif" font-size="16" font-weight="700" letter-spacing="4">AIR BRAKE COMPONENTS</text>

    <!-- Accent line -->
    <rect x="0" y="12" width="60" height="3" fill="#f59e0b" rx="1"/>

    <!-- Main headline -->
    <text x="0" y="85" fill="#ffffff" font-family="'Roboto Condensed', 'Arial Narrow', sans-serif" font-size="68" font-weight="900" letter-spacing="-1">ΕΞΑΡΤΗΜΑΤΑ</text>
    <text x="0" y="155" fill="#ffffff" font-family="'Roboto Condensed', 'Arial Narrow', sans-serif" font-size="68" font-weight="900" letter-spacing="-1">ΑΕΡΟΦΡΕΝΩΝ</text>

    <!-- English line -->
    <text x="0" y="200" fill="#ffffff" font-family="'Roboto', Arial, sans-serif" font-size="22" font-weight="300" opacity="0.8">Air Brake Components</text>

    <!-- Product types -->
    <text x="0" y="260" fill="#ffffff" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="400" opacity="0.6" letter-spacing="2">Φυσούνες  &#x2022;  Σύνδεσμοι  &#x2022;  Ρακόρ</text>

    <!-- Decorative line -->
    <rect x="0" y="285" width="350" height="1" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- AVL Logo -->
  <g transform="translate(1800, 640)">
    <rect x="-45" y="-22" width="90" height="44" rx="4" fill="#142040" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="8" fill="#f59e0b" font-family="'Roboto Condensed', 'Arial Narrow', sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="3">AVL</text>
  </g>
</svg>