    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#142040"/>
      <stop offset="100%" stop-color="#1a2d52"/>
    </linearGradient>
    <radialGradient id="glow1" cx="75%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#142040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="60%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#142040" stop-opacity="0"/>
