<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700" width="1920" height="700">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#142040"/>
      <stop offset="100%" stop-color="#1a2d52"/>
    </linearGradient>
    <!-- Accent glow -->
    <radialGradient id="glow1" cx="75%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#142040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="60%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#142040" stop-opacity="0"/>
    </radialGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>
    <!-- Diagonal lines -->
    <pattern id="diag" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#f59e0b" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <!-- Gear tooth clip for decorative elements -->
    <clipPath id="gearClip">
      <circle cx="0" cy="0" r="120"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="700" fill="url(#bg)"/>
  <rect width="1920" height="700" fill="url(#grid)"/>
  <rect width="1920" height="700" fill="url(#diag)"/>

  <!-- Accent glows -->
  <rect width="1920" height="700" fill="url(#glow1)"/>
  <rect width="1920" height="700" fill="url(#glow2)"/>

  <!-- Large decorative gear - right side -->
  <g transform="translate(1350, 350)" opacity="0.12">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="0" r="240" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Gear teeth (48 teeth) -->
    <g stroke="#f59e0b" stroke-width="2" fill="none">
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(0)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(7.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(15)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(22.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(30)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(37.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(45)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(52.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(60)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(67.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(75)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(82.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(90)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(97.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(105)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(112.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(120)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(127.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(135)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(142.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(150)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(157.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(165)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(172.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(180)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(187.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(195)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(202.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(210)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(217.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(225)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(232.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(240)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(247.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(255)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(262.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(270)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(277.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(285)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(292.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(300)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(307.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(315)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(322.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(330)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(337.5)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(345)"/>
      <path d="M 0,-270 L 8,-290 L -8,-290 Z" transform="rotate(352.5)"/>
    </g>
    <!-- Inner hub -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Spokes -->
    <line x1="0" y1="-80" x2="0" y2="-240" stroke="#f59e0b" stroke-width="1"/>
    <line x1="0" y1="80" x2="0" y2="240" stroke="#f59e0b" stroke-width="1"/>
    <line x1="-80" y1="0" x2="-240" y2="0" stroke="#f59e0b" stroke-width="1"/>
    <line x1="80" y1="0" x2="240" y2="0" stroke="#f59e0b" stroke-width="1"/>
    <line x1="-57" y1="-57" x2="-170" y2="-170" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="57" y1="-57" x2="170" y2="-170" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="-57" y1="57" x2="-170" y2="170" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="57" y1="57" x2="170" y2="170" stroke="#f59e0b" stroke-width="0.8"/>
  </g>

  <!-- Medium decorative gear - upper right -->
  <g transform="translate(1620, 120)" opacity="0.08">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <!-- Teeth simplified -->
    <g stroke="#f59e0b" stroke-width="1.5" fill="none">
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(0)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(15)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(30)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(45)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(60)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(75)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(90)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(105)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(120)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(135)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(150)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(165)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(180)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(195)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(210)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(225)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(240)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(255)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(270)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(285)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(300)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(315)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(330)"/>
      <rect x="-6" y="-160" width="12" height="20" rx="1" transform="rotate(345)"/>
    </g>
  </g>

  <!-- Small gear - lower left area -->
  <g transform="translate(900, 550)" opacity="0.06">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <g stroke="#f59e0b" stroke-width="1" fill="none">
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(0)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(22.5)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(45)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(67.5)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(90)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(112.5)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(135)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(157.5)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(180)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(202.5)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(225)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(247.5)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(270)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(292.5)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(315)"/>
      <rect x="-4" y="-95" width="8" height="15" rx="1" transform="rotate(337.5)"/>
    </g>
  </g>

  <!-- Precision measurement lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <!-- Horizontal dimension line -->
    <line x1="1050" y1="300" x2="1650" y2="300"/>
    <line x1="1050" y1="290" x2="1050" y2="310"/>
    <line x1="1650" y1="290" x2="1650" y2="310"/>
    <!-- Vertical dimension line -->
    <line x1="1100" y1="150" x2="1100" y2="550"/>
    <line x1="1090" y1="150" x2="1110" y2="150"/>
    <line x1="1090" y1="550" x2="1110" y2="550"/>
  </g>

  <!-- Technical annotations -->
  <g opacity="0.05" fill="#ffffff" font-family="monospace" font-size="10">
    <text x="1320" y="290">48T / m2.5</text>
    <text x="1080" y="350" transform="rotate(-90, 1080, 350)">200mm</text>
  </g>

  <!-- Scattered dots pattern - right side -->
  <g fill="#f59e0b" opacity="0.06">
    <circle cx="1000" cy="100" r="2"/>
    <circle cx="1040" cy="130" r="1.5"/>
    <circle cx="1080" cy="90" r="1"/>
    <circle cx="1150" cy="620" r="2"/>
    <circle cx="1200" cy="650" r="1.5"/>
    <circle cx="1750" cy="580" r="2"/>
    <circle cx="1800" cy="550" r="1"/>
    <circle cx="1850" cy="620" r="1.5"/>
  </g>

  <!-- Horizontal accent lines -->
  <line x1="0" y1="698" x2="1920" y2="698" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>
  <line x1="0" y1="0" x2="1920" y2="0" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- Content area - left side text -->
  <g transform="translate(120, 200)">
    <!-- Category label -->
    <text x="0" y="0" fill="#f59e0b" font-family="'Roboto Condensed', 'Arial Narrow', sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-transform="uppercase">ABS SENSOR GEARS</text>

    <!-- Accent line under label -->
    <rect x="0" y="12" width="60" height="3" fill="#f59e0b" rx="1"/>

    <!-- Main headline Greek -->
    <text x="0" y="80" fill="#ffffff" font-family="'Roboto Condensed', 'Arial Narrow', sans-serif" font-size="72" font-weight="900" letter-spacing="-1">ΓΡΑΝΑΖΙΑ ABS</text>

    <!-- English subtitle -->
    <text x="0" y="130" fill="#ffffff" font-family="'Roboto', Arial, sans-serif" font-size="24" font-weight="300" opacity="0.8">Precision ABS Sensor Gears</text>

    <!-- Brand compatibility -->
    <text x="0" y="190" fill="#ffffff" font-family="'Roboto', Arial, sans-serif" font-size="18" font-weight="400" opacity="0.6" letter-spacing="2">DAF  &#x2022;  MAN  &#x2022;  Mercedes  &#x2022;  Volvo  &#x2022;  Scania</text>

    <!-- Decorative bottom line -->
    <rect x="0" y="215" width="400" height="1" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- AVL Logo - bottom right corner -->
  <g transform="translate(1800, 640)">
    <rect x="-45" y="-22" width="90" height="44" rx="4" fill="#142040" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="8" fill="#f59e0b" font-family="'Roboto Condensed', 'Arial Narrow', sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="3">AVL</text>
  </g>
</svg>