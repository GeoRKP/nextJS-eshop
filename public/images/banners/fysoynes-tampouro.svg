<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1728" />
      <stop offset="50%" style="stop-color:#142040" />
      <stop offset="100%" style="stop-color:#1a2744" />
    </linearGradient>
    <linearGradient id="accent-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e2d4a" stroke-width="0.5" />
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)" />
  <rect x="0" y="0" width="400" height="400" fill="url(#accent-fade)" />
  <!-- Drum brake diaphragm illustration on right -->
  <g transform="translate(900, 200)" fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <!-- Outer dome top -->
    <path d="M -110 0 Q -110 -100 0 -100 Q 110 -100 110 0" stroke-width="3" />
    <!-- Outer dome bottom -->
    <path d="M -110 0 Q -110 80 0 80 Q 110 80 110 0" stroke-width="3" />
    <!-- Flange ring -->
    <line x1="-125" y1="0" x2="125" y2="0" stroke-width="4" />
    <!-- Diaphragm membrane -->
    <path d="M -90 -8 Q -60 -30 -30 -10 Q 0 10 30 -10 Q 60 -30 90 -8" stroke-width="2" opacity="0.5" />
    <!-- Push rod -->
    <line x1="0" y1="0" x2="0" y2="130" stroke-width="4" />
    <circle cx="0" cy="135" r="8" stroke-width="2" />
    <!-- Spring coils -->
    <path d="M -20 20 L 20 35 L -20 50 L 20 65" stroke-width="1.5" opacity="0.4" />
    <!-- Bolt holes -->
    <circle cx="-100" cy="0" r="5" fill="#f59e0b" opacity="0.3" />
    <circle cx="-50" cy="0" r="5" fill="#f59e0b" opacity="0.3" />
    <circle cx="50" cy="0" r="5" fill="#f59e0b" opacity="0.3" />
    <circle cx="100" cy="0" r="5" fill="#f59e0b" opacity="0.3" />
  </g>
  <!-- Text content on the left -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#f59e0b" />
    <text x="30" y="19" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#142040" text-anchor="middle">AVL</text>
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="2">FYSOYNES</text>
    <text x="0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#f59e0b" letter-spacing="1">TAMPOYRO</text>
    <text x="0" y="175" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8899b5" letter-spacing="1">Single &amp; double action diaphragms</text>
    <text x="0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8899b5" letter-spacing="1">Pressed &amp; reinforced | Type 16, 20, 24, 30</text>
    <line x1="0" y1="230" x2="120" y2="230" stroke="#f59e0b" stroke-width="2" />
  </g>
  <rect x="0" y="0" width="1200" height="3" fill="#f59e0b" opacity="0.6" />
  <rect x="0" y="397" width="1200" height="3" fill="#f59e0b" opacity="0.3" />
</svg>
