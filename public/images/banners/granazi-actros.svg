<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1728" />
      <stop offset="50%" style="stop-color:#142040" />
      <stop offset="100%" style="stop-color:#1a2744" />
    </linearGradient>
    <linearGradient id="accent-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <!-- Grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e2d4a" stroke-width="0.5" />
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)" />
  <!-- Accent glow on left -->
  <rect x="0" y="0" width="400" height="400" fill="url(#accent-fade)" />
  <!-- Large gear illustration on the right -->
  <g transform="translate(900, 200)">
    <!-- Outer gear ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3" />
    <circle cx="0" cy="0" r="125" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.2" />
    <!-- Gear teeth -->
    <g fill="#f59e0b" opacity="0.25">
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(0)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(15)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(30)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(45)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(60)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(75)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(90)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(105)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(120)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(135)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(150)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(165)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(180)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(195)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(210)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(225)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(240)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(255)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(270)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(285)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(300)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(315)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(330)" />
      <rect x="-5" y="-148" width="10" height="16" rx="1" transform="rotate(345)" />
    </g>
    <!-- Center -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3" />
    <!-- ABS text in center -->
    <text x="0" y="7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#f59e0b" text-anchor="middle" opacity="0.4">ABS</text>
  </g>
  <!-- Text content on the left -->
  <g transform="translate(80, 100)">
    <!-- AVL badge -->
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#f59e0b" />
    <text x="30" y="19" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#142040" text-anchor="middle">AVL</text>
    <!-- Main heading -->
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="2">GRANAZI ABS</text>
    <text x="0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#f59e0b" letter-spacing="1">MERCEDES ACTROS</text>
    <!-- Description -->
    <text x="0" y="175" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8899b5" letter-spacing="1">48 teeth sensor wheel | High-grade steel</text>
    <text x="0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8899b5" letter-spacing="1">WABCO &amp; Knorr-Bremse compatible</text>
    <!-- CTA line -->
    <line x1="0" y1="230" x2="120" y2="230" stroke="#f59e0b" stroke-width="2" />
  </g>
  <!-- Top and bottom accent lines -->
  <rect x="0" y="0" width="1200" height="3" fill="#f59e0b" opacity="0.6" />
  <rect x="0" y="397" width="1200" height="3" fill="#f59e0b" opacity="0.3" />
</svg>
