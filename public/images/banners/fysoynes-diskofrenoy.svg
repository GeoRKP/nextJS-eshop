<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a2744" />
      <stop offset="50%" style="stop-color:#142040" />
      <stop offset="100%" style="stop-color:#0d1728" />
    </linearGradient>
    <linearGradient id="accent-fade" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e2d4a" stroke-width="0.5" />
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)" />
  <rect x="800" y="0" width="400" height="400" fill="url(#accent-fade)" />
  <!-- Disc brake diaphragm illustration on left -->
  <g transform="translate(250, 200)" fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <!-- Double-action chamber - top section (service) -->
    <path d="M -100 -20 Q -100 -90 0 -90 Q 100 -90 100 -20" stroke-width="3" />
    <!-- Middle flange -->
    <line x1="-115" y1="-20" x2="115" y2="-20" stroke-width="3" />
    <!-- Bottom section (spring/parking) -->
    <path d="M -100 -20 Q -100 50 0 50 Q 100 50 100 -20" stroke-width="3" />
    <!-- Second flange -->
    <line x1="-115" y1="50" x2="115" y2="50" stroke-width="2" />
    <!-- Push rod assembly -->
    <line x1="0" y1="50" x2="0" y2="130" stroke-width="4" />
    <!-- Caliper bracket hint -->
    <rect x="-25" y="115" width="50" height="25" rx="4" stroke-width="2" />
    <!-- Air ports -->
    <circle cx="-70" cy="-60" r="8" stroke-width="1.5" />
    <circle cx="-70" cy="20" r="8" stroke-width="1.5" />
    <!-- Port labels -->
    <text x="-70" y="-56" font-family="Arial" font-size="8" fill="#f59e0b" text-anchor="middle" opacity="0.6">S</text>
    <text x="-70" y="24" font-family="Arial" font-size="8" fill="#f59e0b" text-anchor="middle" opacity="0.6">P</text>
    <!-- Internal spring -->
    <path d="M -18 -10 L 18 -3 L -18 4 L 18 11" stroke-width="1.5" opacity="0.4" />
    <!-- Disc brake rotor hint -->
    <g transform="translate(0, 155)">
      <circle cx="0" cy="0" r="35" stroke-width="1.5" opacity="0.5" />
      <circle cx="0" cy="0" r="25" stroke-width="1" opacity="0.3" />
      <circle cx="0" cy="0" r="10" stroke-width="1" opacity="0.3" />
      <!-- Ventilation slots -->
      <line x1="-20" y1="-10" x2="-10" y2="-5" stroke-width="0.8" opacity="0.3" />
      <line x1="-15" y1="10" x2="-5" y2="5" stroke-width="0.8" opacity="0.3" />
      <line x1="10" y1="-15" x2="5" y2="-5" stroke-width="0.8" opacity="0.3" />
      <line x1="15" y1="8" x2="8" y2="3" stroke-width="0.8" opacity="0.3" />
    </g>
  </g>
  <!-- Text content on the right -->
  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#f59e0b" />
    <text x="30" y="19" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#142040" text-anchor="middle">AVL</text>
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="2">FYSOYNES</text>
    <text x="0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#f59e0b" letter-spacing="1">DISKOFRENOY</text>
    <text x="0" y="175" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8899b5" letter-spacing="1">Double-action disc brake chambers</text>
    <text x="0" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8899b5" letter-spacing="1">AVL &amp; SORL | Service + Parking brake</text>
    <line x1="0" y1="230" x2="120" y2="230" stroke="#f59e0b" stroke-width="2" />
  </g>
  <rect x="0" y="0" width="1200" height="3" fill="#f59e0b" opacity="0.6" />
  <rect x="0" y="397" width="1200" height="3" fill="#f59e0b" opacity="0.3" />
</svg>
