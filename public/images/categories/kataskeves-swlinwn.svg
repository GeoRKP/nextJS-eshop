<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744" />
      <stop offset="100%" style="stop-color:#142040" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" />
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e2d4a" stroke-width="0.5" />
  </pattern>
  <rect width="400" height="400" fill="url(#grid)" />
  <!-- Hose / Tubing icon -->
  <g transform="translate(200, 165)" fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flexible hose - S curve -->
    <path d="M -80 -60 C -80 -60, -60 -60, -40 -30 C -20 0, 20 0, 40 -30 C 60 -60, 80 -60, 80 -30 C 80 0, 60 30, 40 50" stroke-width="12" opacity="0.15" />
    <path d="M -80 -60 C -80 -60, -60 -60, -40 -30 C -20 0, 20 0, 40 -30 C 60 -60, 80 -60, 80 -30 C 80 0, 60 30, 40 50" stroke-width="3" />
    <!-- Braiding pattern on hose -->
    <path d="M -65 -58 C -50 -50, -30 -20, -25 -10" stroke-width="0.8" opacity="0.4" />
    <path d="M -40 -55 C -25 -45, -5 -15, 0 -5" stroke-width="0.8" opacity="0.4" />
    <path d="M -10 -25 C 10 -15, 30 -15, 45 -25" stroke-width="0.8" opacity="0.4" />
    <path d="M 50 -40 C 65 -50, 75 -50, 80 -40" stroke-width="0.8" opacity="0.4" />
    <!-- Left fitting -->
    <rect x="-95" y="-68" width="20" height="16" rx="2" stroke-width="2" />
    <line x1="-92" y1="-64" x2="-92" y2="-56" stroke-width="1" opacity="0.5" />
    <line x1="-88" y1="-64" x2="-88" y2="-56" stroke-width="1" opacity="0.5" />
    <!-- Right fitting -->
    <rect x="32" y="46" width="20" height="16" rx="2" stroke-width="2" />
    <line x1="48" y1="50" x2="48" y2="58" stroke-width="1" opacity="0.5" />
    <line x1="44" y1="50" x2="44" y2="58" stroke-width="1" opacity="0.5" />
    <!-- Secondary straight hose -->
    <g transform="translate(0, 80)">
      <line x1="-70" y1="0" x2="70" y2="0" stroke-width="8" opacity="0.15" />
      <line x1="-70" y1="0" x2="70" y2="0" stroke-width="2.5" />
      <!-- End fittings -->
      <rect x="-85" y="-6" width="18" height="12" rx="2" stroke-width="1.5" />
      <rect x="67" y="-6" width="18" height="12" rx="2" stroke-width="1.5" />
    </g>
  </g>
  <!-- Category label -->
  <text x="200" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARKOUTSIA / SWLHNES</text>
  <!-- AVL branding -->
  <text x="200" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" letter-spacing="4">AVL</text>
  <!-- Corner accents -->
  <line x1="15" y1="15" x2="45" y2="15" stroke="#f59e0b" stroke-width="2" />
  <line x1="15" y1="15" x2="15" y2="45" stroke="#f59e0b" stroke-width="2" />
  <line x1="355" y1="385" x2="385" y2="385" stroke="#f59e0b" stroke-width="2" />
  <line x1="385" y1="355" x2="385" y2="385" stroke="#f59e0b" stroke-width="2" />
</svg>
