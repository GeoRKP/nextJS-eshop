<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744" />
      <stop offset="100%" style="stop-color:#142040" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" />
  <!-- Subtle grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e2d4a" stroke-width="0.5" />
  </pattern>
  <rect width="400" height="400" fill="url(#grid)" />
  <!-- ABS Gear/Sensor wheel -->
  <g transform="translate(200, 175)">
    <!-- Outer gear ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Gear teeth (48 simplified to 24 visible) -->
    <g fill="#f59e0b">
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(0)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(15)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(30)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(45)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(60)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(75)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(90)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(105)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(120)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(135)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(150)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(165)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(180)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(195)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(210)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(225)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(240)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(255)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(270)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(285)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(300)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(315)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(330)" />
      <rect x="-4" y="-95" width="8" height="12" rx="1" transform="rotate(345)" />
    </g>
    <!-- Center hole -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f59e0b" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Spokes -->
    <line x1="0" y1="-30" x2="0" y2="-80" stroke="#2a3a5c" stroke-width="1" />
    <line x1="0" y1="30" x2="0" y2="80" stroke="#2a3a5c" stroke-width="1" />
    <line x1="-30" y1="0" x2="-80" y2="0" stroke="#2a3a5c" stroke-width="1" />
    <line x1="30" y1="0" x2="80" y2="0" stroke="#2a3a5c" stroke-width="1" />
    <!-- ABS label -->
    <text x="0" y="6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b" text-anchor="middle">ABS</text>
  </g>
  <!-- Category label -->
  <text x="200" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ΓΡANAZIA ABS</text>
  <!-- AVL branding -->
  <text x="200" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" letter-spacing="4">AVL</text>
  <!-- Corner accents -->
  <line x1="15" y1="15" x2="45" y2="15" stroke="#f59e0b" stroke-width="2" />
  <line x1="15" y1="15" x2="15" y2="45" stroke="#f59e0b" stroke-width="2" />
  <line x1="355" y1="385" x2="385" y2="385" stroke="#f59e0b" stroke-width="2" />
  <line x1="385" y1="355" x2="385" y2="385" stroke="#f59e0b" stroke-width="2" />
</svg>
