<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744" />
      <stop offset="100%" style="stop-color:#142040" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" />
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e2d4a" stroke-width="0.5" />
  </pattern>
  <rect width="400" height="400" fill="url(#grid)" />
  <!-- Pipe Fittings / Connectors -->
  <g transform="translate(200, 165)" fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-linejoin="round">
    <!-- T-fitting -->
    <g transform="translate(-60, -30)">
      <!-- Horizontal pipe -->
      <rect x="-40" y="-8" width="80" height="16" rx="2" stroke-width="2" />
      <!-- Vertical pipe going down -->
      <rect x="-8" y="8" width="16" height="45" rx="2" stroke-width="2" />
      <!-- Thread lines on left -->
      <line x1="-38" y1="-4" x2="-38" y2="4" stroke-width="1" opacity="0.5" />
      <line x1="-34" y1="-4" x2="-34" y2="4" stroke-width="1" opacity="0.5" />
      <!-- Thread lines on right -->
      <line x1="38" y1="-4" x2="38" y2="4" stroke-width="1" opacity="0.5" />
      <line x1="34" y1="-4" x2="34" y2="4" stroke-width="1" opacity="0.5" />
      <!-- Thread lines on bottom -->
      <line x1="-4" y1="49" x2="4" y2="49" stroke-width="1" opacity="0.5" />
      <line x1="-4" y1="45" x2="4" y2="45" stroke-width="1" opacity="0.5" />
    </g>
    <!-- Elbow fitting -->
    <g transform="translate(70, -20)">
      <!-- Vertical section -->
      <rect x="-8" y="-30" width="16" height="35" rx="2" stroke-width="2" />
      <!-- Curved section -->
      <path d="M 8 5 Q 8 25 28 25" stroke-width="2" fill="none" />
      <path d="M -8 5 Q -8 40 28 40" stroke-width="2" fill="none" />
      <!-- Horizontal section -->
      <rect x="28" y="25" width="30" height="16" rx="2" stroke-width="2" />
      <!-- Thread lines -->
      <line x1="-4" y1="-28" x2="4" y2="-28" stroke-width="1" opacity="0.5" />
      <line x1="-4" y1="-24" x2="4" y2="-24" stroke-width="1" opacity="0.5" />
    </g>
    <!-- Straight coupling -->
    <g transform="translate(0, 55)">
      <rect x="-50" y="-7" width="40" height="14" rx="2" stroke-width="2" />
      <rect x="-14" y="-10" width="28" height="20" rx="3" stroke-width="2.5" />
      <rect x="10" y="-7" width="40" height="14" rx="2" stroke-width="2" />
      <!-- Hex nut detail -->
      <line x1="-10" y1="-8" x2="-10" y2="8" stroke-width="1" opacity="0.4" />
      <line x1="10" y1="-8" x2="10" y2="8" stroke-width="1" opacity="0.4" />
    </g>
  </g>
  <!-- Category label -->
  <text x="200" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">RAKOR / SWLHNES</text>
  <!-- AVL branding -->
  <text x="200" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" letter-spacing="4">AVL</text>
  <!-- Corner accents -->
  <line x1="15" y1="15" x2="45" y2="15" stroke="#f59e0b" stroke-width="2" />
  <line x1="15" y1="15" x2="15" y2="45" stroke="#f59e0b" stroke-width="2" />
  <line x1="355" y1="385" x2="385" y2="385" stroke="#f59e0b" stroke-width="2" />
  <line x1="385" y1="355" x2="385" y2="385" stroke="#f59e0b" stroke-width="2" />
</svg>
