<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#142040;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg)" />
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e2d4a" stroke-width="0.5" />
  </pattern>
  <rect width="600" height="600" fill="url(#grid)" />
  <!-- Truck silhouette -->
  <g transform="translate(150, 180)" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Truck body -->
    <rect x="0" y="60" width="180" height="100" rx="4" />
    <!-- Cab -->
    <path d="M 180 60 L 180 30 Q 180 10 200 10 L 260 10 Q 280 10 280 30 L 280 160 L 180 160 L 180 60" />
    <!-- Windshield -->
    <line x1="200" y1="30" x2="260" y2="30" />
    <line x1="200" y1="30" x2="200" y2="70" />
    <!-- Wheels -->
    <circle cx="60" cy="170" r="22" stroke-width="3" />
    <circle cx="60" cy="170" r="10" stroke-width="2" />
    <circle cx="120" cy="170" r="22" stroke-width="3" />
    <circle cx="120" cy="170" r="10" stroke-width="2" />
    <circle cx="250" cy="170" r="22" stroke-width="3" />
    <circle cx="250" cy="170" r="10" stroke-width="2" />
    <!-- Ground line -->
    <line x1="-20" y1="195" x2="310" y2="195" stroke="#2a3a5c" stroke-width="1" />
  </g>
  <!-- AVL Text -->
  <text x="300" y="460" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="12">AVL</text>
  <!-- Subtitle -->
  <text x="300" y="495" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7a96" text-anchor="middle" letter-spacing="3" text-transform="uppercase">TRUCK PARTS</text>
  <!-- Corner accents -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#f59e0b" stroke-width="2" />
  <line x1="20" y1="20" x2="20" y2="60" stroke="#f59e0b" stroke-width="2" />
  <line x1="540" y1="580" x2="580" y2="580" stroke="#f59e0b" stroke-width="2" />
  <line x1="580" y1="540" x2="580" y2="580" stroke="#f59e0b" stroke-width="2" />
</svg>
