<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Technical drawing placeholder">
  <defs>
    <!-- Subtle grid -->
    <pattern id="gridMinor" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2027" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="gridMajor" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="#1a2027" stroke-width="0.7" stroke-opacity="0.1"/>
    </pattern>
    <!-- Arrow marker for dimension lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2027"/>
    </marker>
  </defs>

  <!-- Warm off-white background -->
  <rect width="600" height="600" fill="#fbf9f3"/>
  <rect width="600" height="600" fill="url(#gridMinor)"/>
  <rect width="600" height="600" fill="url(#gridMajor)"/>

  <!-- Outer frame -->
  <rect x="24" y="24" width="552" height="552" fill="none" stroke="#1a2027" stroke-width="1" stroke-opacity="0.85"/>
  <rect x="34" y="34" width="532" height="532" fill="none" stroke="#1a2027" stroke-width="0.4" stroke-opacity="0.4"/>

  <!-- Corner registration marks -->
  <g stroke="#ecb914" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 24 50 L 24 24 L 50 24"/>
    <path d="M 550 24 L 576 24 L 576 50"/>
    <path d="M 576 550 L 576 576 L 550 576"/>
    <path d="M 50 576 L 24 576 L 24 550"/>
  </g>

  <!-- Title block (top-left) -->
  <g font-family="'Courier New', ui-monospace, monospace" fill="#1a2027" letter-spacing="2">
    <text x="48" y="64" font-size="10" font-weight="bold">▲ TECHNICAL DRAWING</text>
    <text x="48" y="78" font-size="8" font-weight="normal" fill="#1a2027" fill-opacity="0.55">SHT 01 / SCALE 1:1 / mm</text>
  </g>

  <!-- Drawing number (top-right) -->
  <g font-family="'Courier New', ui-monospace, monospace" fill="#1a2027" letter-spacing="2" text-anchor="end">
    <text x="552" y="64" font-size="10" font-weight="bold">DWG-AVL-001</text>
    <text x="552" y="78" font-size="8" font-weight="normal" fill="#1a2027" fill-opacity="0.55">REV A — PENDING</text>
  </g>

  <!-- Crosshairs through center (light, dashed) -->
  <g stroke="#1a2027" stroke-width="0.6" stroke-opacity="0.25" stroke-dasharray="4 4">
    <line x1="300" y1="120" x2="300" y2="480"/>
    <line x1="120" y1="300" x2="480" y2="300"/>
  </g>

  <!-- Flange / hub front view -->
  <g transform="translate(300 300)">
    <!-- Outer disc (filled subtle) -->
    <circle cx="0" cy="0" r="140" fill="#1a2027" fill-opacity="0.04" stroke="#1a2027" stroke-width="2"/>
    <!-- Inner secondary ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1a2027" stroke-width="0.8" stroke-opacity="0.55"/>
    <!-- Pitch circle (dashed) for bolts -->
    <circle cx="0" cy="0" r="98" fill="none" stroke="#1a2027" stroke-width="0.7" stroke-dasharray="5 4" stroke-opacity="0.45"/>
    <!-- Center bore -->
    <circle cx="0" cy="0" r="38" fill="#fbf9f3" stroke="#1a2027" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#1a2027" stroke-width="0.7" stroke-opacity="0.55"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2.5" fill="#1a2027"/>
    <!-- Crosshairs in bore -->
    <line x1="-44" y1="0" x2="-32" y2="0" stroke="#1a2027" stroke-width="0.7"/>
    <line x1="32" y1="0" x2="44" y2="0" stroke="#1a2027" stroke-width="0.7"/>
    <line x1="0" y1="-44" x2="0" y2="-32" stroke="#1a2027" stroke-width="0.7"/>
    <line x1="0" y1="32" x2="0" y2="44" stroke="#1a2027" stroke-width="0.7"/>

    <!-- Six bolt holes on pitch circle (radius 98), 60° apart, starting at -90° -->
    <g fill="#fbf9f3" stroke="#1a2027" stroke-width="1.5">
      <circle cx="0" cy="-98" r="11"/>
      <circle cx="84.87" cy="-49" r="11"/>
      <circle cx="84.87" cy="49" r="11"/>
      <circle cx="0" cy="98" r="11"/>
      <circle cx="-84.87" cy="49" r="11"/>
      <circle cx="-84.87" cy="-49" r="11"/>
    </g>
    <!-- Bolt hole centermarks -->
    <g stroke="#1a2027" stroke-width="0.6" stroke-opacity="0.5">
      <line x1="-3" y1="-98" x2="3" y2="-98"/>
      <line x1="0" y1="-101" x2="0" y2="-95"/>
      <line x1="84.87" y1="-52" x2="84.87" y2="-46"/>
      <line x1="81.87" y1="-49" x2="87.87" y2="-49"/>
      <line x1="84.87" y1="46" x2="84.87" y2="52"/>
      <line x1="81.87" y1="49" x2="87.87" y2="49"/>
      <line x1="-3" y1="98" x2="3" y2="98"/>
      <line x1="0" y1="95" x2="0" y2="101"/>
      <line x1="-84.87" y1="46" x2="-84.87" y2="52"/>
      <line x1="-87.87" y1="49" x2="-81.87" y2="49"/>
      <line x1="-84.87" y1="-52" x2="-84.87" y2="-46"/>
      <line x1="-87.87" y1="-49" x2="-81.87" y2="-49"/>
    </g>
  </g>

  <!-- Dimension line: outer diameter (top) -->
  <g stroke="#1a2027" stroke-width="0.9" fill="none">
    <line x1="160" y1="150" x2="160" y2="158"/>
    <line x1="440" y1="150" x2="440" y2="158"/>
    <line x1="160" y1="154" x2="440" y2="154" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="300" y="146" font-family="'Courier New', ui-monospace, monospace" font-size="11" font-weight="bold" fill="#1a2027" text-anchor="middle" letter-spacing="1">⌀280</text>

  <!-- Dimension line: bore diameter (left) -->
  <g stroke="#1a2027" stroke-width="0.9" fill="none">
    <line x1="100" y1="262" x2="92" y2="262"/>
    <line x1="100" y1="338" x2="92" y2="338"/>
    <line x1="96" y1="262" x2="96" y2="338" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="86" y="304" font-family="'Courier New', ui-monospace, monospace" font-size="10" font-weight="bold" fill="#1a2027" text-anchor="end" letter-spacing="1">⌀76</text>

  <!-- Bolt count callout (bottom-right diagonal leader line) -->
  <g stroke="#1a2027" stroke-width="0.9" fill="none">
    <line x1="383" y1="349" x2="450" y2="410" marker-start="url(#arrow)"/>
    <line x1="450" y1="410" x2="500" y2="410"/>
  </g>
  <text x="500" y="406" font-family="'Courier New', ui-monospace, monospace" font-size="10" font-weight="bold" fill="#1a2027" text-anchor="end" letter-spacing="1">6×⌀22</text>

  <!-- Bottom bar: "no image" status -->
  <g>
    <rect x="34" y="500" width="532" height="38" fill="#1a2027" fill-opacity="0.04"/>
    <rect x="34" y="500" width="6" height="38" fill="#ecb914"/>
    <text x="56" y="525" font-family="'Courier New', ui-monospace, monospace" font-size="14" font-weight="bold" fill="#1a2027" letter-spacing="3">NO IMAGE AVAILABLE</text>
    <text x="552" y="525" font-family="'Courier New', ui-monospace, monospace" font-size="11" fill="#1a2027" fill-opacity="0.55" text-anchor="end" letter-spacing="2">— REFER TO SPEC —</text>
  </g>

  <!-- AVL stamp (bottom-left, on top of bottom bar offset) -->
  <g transform="translate(300 460)">
    <text x="0" y="0" font-family="'Courier New', ui-monospace, monospace" font-size="22" font-weight="900" fill="#1a2027" text-anchor="middle" letter-spacing="14">AVL</text>
    <text x="0" y="16" font-family="'Courier New', ui-monospace, monospace" font-size="8" fill="#1a2027" fill-opacity="0.55" text-anchor="middle" letter-spacing="6">TRUCK PARTS</text>
    <line x1="-46" y1="-30" x2="-30" y2="-30" stroke="#ecb914" stroke-width="2"/>
    <line x1="30" y1="-30" x2="46" y2="-30" stroke="#ecb914" stroke-width="2"/>
  </g>
</svg>
