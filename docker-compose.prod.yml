services:
  web:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - /opt/eshop/uploads:/app/uploads
    env_file:
      - .env.production
    networks:
      - kapda_default
    restart: unless-stopped
    healthcheck:
      # busybox wget ships in node:20-alpine. Lets Docker/Caddy tell "up but
      # wedged" from "running" instead of routing to a dead app.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          memory: 256M

networks:
  kapda_default:
    external: true
