services:
  web:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - /opt/eshop/uploads:/app/uploads
    env_file:
      - .env.production
    networks:
      - kapda_default
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          memory: 256M

networks:
  kapda_default:
    external: true
