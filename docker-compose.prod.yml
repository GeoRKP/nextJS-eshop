services:
  web:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - /opt/eshop/uploads:/app/uploads
    env_file:
      - .env.production
    networks:
      - kapda_default
    restart: unless-stopped
    healthcheck:
      # busybox wget (node:20-alpine). Use 127.0.0.1, not localhost: the app
      # listens on 0.0.0.0 (IPv4) and localhost resolves to ::1 (IPv6) here,
      # which would refuse the connection and falsely mark the app unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          memory: 256M

networks:
  kapda_default:
    external: true
